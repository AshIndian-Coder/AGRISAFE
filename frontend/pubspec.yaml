name: agrotrace_portal
description: >-
  AgroTrace Portal - Farm-to-Shelf Traceability Grid. Flutter frontend for the
  Agro Trace blockchain agricultural supply-chain backend (Smart India Hackathon).
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Networking
  http: ^1.2.2
  # Session / settings persistence
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # Bundled locally (OFL) so the app works offline and on any Flutter
    # version — no runtime fetching, no package-version drift.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
