spring:
  datasource:
    url: jdbc:mysql://localhost:3306/agro_trace_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: root
    password: root

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.agro.trace: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.security: DEBUG

app:
  blockchain:
    enabled: false
  testing:
    simulated-mode: true
  notification:
    enabled: false
  payment:
    enabled: false