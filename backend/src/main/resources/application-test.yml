spring:
  datasource:
    url: jdbc:h2:mem:agro_trace_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: dGVzdFNlY3JldEtleUZvckFncm9UcmFjZUJhY2tlbmQyMDI0U0lI
  blockchain:
    enabled: false
  testing:
    simulated-mode: true
    anomaly-detection-enabled: false
  notification:
    enabled: false
  payment:
    enabled: false
  security:
    pin-attempt-limit: 5
    pin-lockout-duration-minutes: 30

logging:
  level:
    com.agro.trace: DEBUG