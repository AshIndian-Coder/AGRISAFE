version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: agro-trace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agro_trace_dev
      MYSQL_USER: agro_trace_user
      MYSQL_PASSWORD: agro_trace_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  app:
    build: .
    container_name: agro-trace-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/agro_trace_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: agro_trace_user
      DB_PASSWORD: agro_trace_pass
      JWT_SECRET: ${JWT_SECRET:-bXlTZWNyZXRLZXlTZWNyZXRLZXlTZWNyZXRLZXlTZWNyZXRLZXk=}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data: